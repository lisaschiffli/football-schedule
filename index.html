<style>

    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
  .banner { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: .9rem; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: transparent; color: var(--text); padding: 8px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .link { border: 0; background: none; color: var(--accent); font: inherit; font-size: .9rem; cursor: pointer; padding: 8px 4px; text-decoration: underline; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .panel h2 { font-size: 1rem; margin: 0 0 8px; }
  .panel h3 { font-size: .85rem; margin: 12px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: .85rem; display: inline-flex; align-items: center; gap: 4px; }
  .chip button { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; padding: 2px 6px; border-radius: 999px; }
  .chip button:hover { color: var(--text); }
  .add { display: flex; gap: 6px; margin-top: 8px; }
  .add select, .add button { font: inherit; font-size: .9rem; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .add select { flex: 1; min-width: 0; max-width: 320px; }
  .add button { cursor: pointer; }
  .day { margin: 22px 0 8px; font-size: 1.05rem; position: sticky; top: 0; background: var(--bg); padding: 6px 0; z-index: 1; }
  .game { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
          display: grid; grid-template-columns: 78px 1fr; gap: 4px 12px; }
  .game { border-left: 4px solid transparent; }
  .game.fav { border-left-color: var(--fav); }
  .time { font-weight: 600; font-variant-numeric: tabular-nums; }
  .lg { display: block; font-size: .72rem; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
  .match { font-weight: 600; }
  .rank { color: var(--muted); font-weight: 500; font-size: .85em; }
  .rec { color: var(--muted); font-weight: 400; font-size: .85em; }
  .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .82rem; }
  .tag { border-radius: 999px; padding: 1px 9px; font-weight: 500; }
  .tag.ota { background: var(--ota-bg); color: var(--ota); }
  .tag.prime { background: var(--prime-bg); color: var(--prime); }
  .tag.espn { background: var(--espn-bg); color: var(--espn); }
  .tag.stream { background: var(--stream-bg); color: var(--stream); }
  .game.dim { opacity: .55; }
  .tag.check { background: var(--warn-bg); color: var(--warn); }
  .tag.fav { background: var(--fav-bg); color: var(--fav); }
  .tag.note { background: var(--chip); color: var(--muted); }
  .note { grid-column: 2; color: var(--muted); font-size: .8rem; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  @media (max-width: 480px) { .game { grid-template-columns: 64px 1fr; } }
</style>
</head>

const state = { mode: "fav-notable", favorites: loadFavorites() };

function loadFavorites() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (saved && Array.isArray(saved.nfl) && Array.isArray(saved.college)) return saved;
  } catch (e) { /* storage unavailable: use defaults */ }
  return JSON.parse(JSON.stringify(DATA.defaults.favorites));

function saveFavorites() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.favorites)); } catch (e) { /* ignore */ }

  if (text != null) n.textContent = text;
  return n;

function teamName(league, abbr) {
  const t = (DATA.teams[league] || []).find(x => x.abbr === abbr);

  });
  if (!shown.length) {
    box.appendChild(el("div", "empty", "No games match this view. Try “All games”."));
    return;
  }
  let day = null;
  for (const g of shown) {
    if (g.day_label !== day) { day = g.day_label; box.appendChild(el("h2", "day", day)); }
    const favs = favTeams(g);
    const row = el("div", "game" + (favs.length ? " fav" : "") + (g.status === "not_local" ? " dim" : ""));
    const time = el("div", "time", g.time_label);
    time.appendChild(el("span", "lg", LEAGUE_LABEL[g.league] + (g.state === "post" ? " · Final" : g.state === "in" ? " · Live" : "")));
    row.appendChild(time);
    const match = el("div", "match");
    match.appendChild(teamLine(g.away));
    match.appendChild(document.createTextNode(g.neutral ? " vs " : " at "));
    match.appendChild(teamLine(g.home));
    row.appendChild(match);

    const meta = el("div", "meta");
    const isPrime = g.channel === "PRIME";
    const netClass = isPrime ? "prime" : g.channel === "ESPN" ? "espn" : g.channel === "STREAM" ? "stream" : "ota";
    meta.appendChild(el("span", "tag " + netClass, g.network_label));
    const needsCheck = g.status === "regional" || g.status === "likely_local";
    const statusClass = { tablo_ok: "ota", not_local: "note", espn_app: "espn", stream_only: "stream" }[g.status] || (needsCheck ? "check" : "prime");
    if (isPrime || needsCheck || ["tablo_ok", "not_local", "espn_app", "stream_only"].includes(g.status)) {
      meta.appendChild(el("span", "tag " + statusClass, g.status_label));
    }
    for (const t of favs) meta.appendChild(el("span", "tag fav", "★ " + t.name));
    for (const r of g.notable_reasons) meta.appendChild(el("span", "tag note", r));
    row.appendChild(meta);
    if (g.note) row.appendChild(el("div", "note", g.note));
    box.appendChild(row);
  }
}

function renderPanel() {
  const panel = document.getElementById("panel");
  panel.replaceChildren(el("h2", null, "Favorite teams"));
  for (const league of ["college", "nfl"]) {
    panel.appendChild(el("h3", null, LEAGUE_LABEL[league]));
    const chips = el("div", "chips");
    for (const abbr of state.favorites[league]) {
      const chip = el("span", "chip", teamName(league, abbr));
      const x = el("button", null, "×");
      x.title = "Remove " + teamName(league, abbr);
      x.setAttribute("aria-label", x.title);
      x.onclick = () => { state.favorites[league] = state.favorites[league].filter(a => a !== abbr); changed(true); };
      chip.appendChild(x);
      chips.appendChild(chip);
    }
    panel.appendChild(chips);
    const add = el("div", "add");
    const sel = el("select");
    sel.setAttribute("aria-label", "Add " + LEAGUE_LABEL[league] + " team");
    sel.appendChild(new Option("Add a team…", ""));
    const have = new Set(state.favorites[league]);
    for (const t of DATA.teams[league] || []) if (!have.has(t.abbr)) sel.appendChild(new Option(t.name, t.abbr));
    const btn = el("button", null, "Add");
    btn.onclick = () => {
      if (!sel.value) return;
      state.favorites[league].push(sel.value);
      changed(true);
    };
    add.append(sel, btn);
    panel.appendChild(add);
  }
  const reset = el("button", "link", "Reset to defaults from config.json");
  reset.onclick = () => { state.favorites = JSON.parse(JSON.stringify(DATA.defaults.favorites)); changed(true); };
  panel.appendChild(reset);
}

function changed(rerenderPanel) {
  saveFavorites();
  if (rerenderPanel) renderPanel();
  renderGames();
}

const TABLO_NOTE = {
  checked: "local games confirmed against your Tablo guide",
  not_configured: "regional games are estimates (run --tablo-setup to check your Tablo guide)",
  failed: "regional games are estimates",
  disabled: "regional games are estimates"
};
document.getElementById("sub").textContent =
  DATA.window + " · Eastern time · over the air, Prime Video, ESPN app, streaming · " +
  (TABLO_NOTE[DATA.tablo] || "") + " · updated " + DATA.generated;
document.querySelectorAll("#mode button").forEach(b => {
  b.onclick = () => {
    state.mode = b.dataset.mode;
    document.querySelectorAll("#mode button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    renderGames();
  };
});
const toggle = document.getElementById("edit-toggle");
toggle.onclick = () => {
  const panel = document.getElementById("panel");
  panel.hidden = !panel.hidden;
  toggle.setAttribute("aria-expanded", String(!panel.hidden));
  if (!panel.hidden) renderPanel();
};
renderBanners();
renderGames();
</script>
</body>
</html>
